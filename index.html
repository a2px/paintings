<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashley Xie, Painter</title>
  <meta name="description" content="Portfolio of Ashley Xie, painter. Selected paintings, exhibitions, and contact.">
  <link rel="icon" href="assets/favicon.svg?v=ba8ed4a494" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css?v=37e82aa47e">
  <link rel="stylesheet" href="assets/css/site.css?v=9534032bce">
</head>
<body>
  <a class="skip" href="#work">Skip to the paintings</a>


  <nav class="mainnav" aria-label="Main">
    <div class="wrap mainnav__inner">
      <ul>
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#exhibitions">Exhibitions</a></li>
        <li><a href="https://www.instagram.com/ashleyartifex/" target="_blank" rel="noopener">Instagram<span class="visually-hidden"> (opens in a new tab)</span></a></li>
      </ul>
      <p class="mainnav__meta"><strong>Latest:</strong> <a href="#exhibitions" data-bind="latest"></a></p>
    </div>
  </nav>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap">
        <h1 id="hero-title" class="hero__statement" data-bind="statement"></h1>
      </div>
    </section>

    <section id="work" class="section" tabindex="-1" aria-labelledby="work-title">
      <div class="wrap section__head">
        <h2 id="work-title" class="label"><span class="label__num" aria-hidden="true">01/</span>Selected work</h2>
      </div>
      <div class="wrap">
        <ol class="works" id="works"></ol>
      </div>
    </section>

    <section id="about" class="section section--ruled" aria-labelledby="about-title">
      <div class="wrap about">
        <h2 id="about-title" class="label"><span class="label__num" aria-hidden="true">02/</span>About</h2>
        <div class="about__body">
          <div class="about__text" id="aboutText"></div>
          <h3 class="subhead" id="educationHead">Education</h3>
          <dl class="facts" id="education"></dl>
        </div>
      </div>
    </section>

    <section id="exhibitions" class="section section--ruled" aria-labelledby="ex-title">
      <div class="wrap">
        <div class="section__head">
          <h2 id="ex-title" class="label"><span class="label__num" aria-hidden="true">03/</span>Exhibitions</h2>
        </div>
        <table class="extable" role="table">
          <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Name</th><th scope="col" role="columnheader">Description</th><th scope="col" role="columnheader">Year</th></tr></thead>
          <tbody id="exhibitionsBody" role="rowgroup"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="footer" id="contact">
    <div class="wrap footer__grid">
      <p class="footer__name">Ashley Xie</p>
      <div id="contactBlock" hidden>
        <h2 class="footer__h">Contact</h2>
        <div id="contactLinks"></div>
      </div>
      <div>
        <h2 class="footer__h">Menu</h2>
        <p><a href="#work">Work</a></p>
        <p><a href="#about">About</a></p>
        <p><a href="#exhibitions">Exhibitions</a></p>
      </div>
    </div>
  </footer>

  <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
    <button class="viewer__close" type="button" id="viewerClose">Close</button>
    <figure class="viewer__fig">
      <img id="viewerImg" alt="">
      <figcaption>
        <p class="viewer__num" id="viewerNum"></p>
        <h2 id="viewerTitle" class="viewer__title"></h2>
        <p id="viewerMeta"></p>
        <div class="viewer__nav">
          <button class="btn" type="button" id="viewerPrev">Previous</button>
          <button class="btn" type="button" id="viewerNext">Next</button>
        </div>
      </figcaption>
    </figure>
  </dialog>

  <script src="assets/js/content.js?v=4cbf5ead95"></script>
  <script src="assets/js/site.js?v=6d0ac80453"></script>
</body>
</html>
